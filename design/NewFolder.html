<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>1.7 New folder dialog ★ NEW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&amp;family=Figtree:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #4F5121;outline-offset:2px}a{color:#2F3020}a:hover{color:#B23A26}
.fl{font-size: 13px;font-weight:600;margin-bottom: 8px;display:block}
.fld{height:52px;width:100%;box-sizing:border-box;border:2px solid #4F5121;border-radius: 12px;background:#FFFFFF;padding:0 16px;font: 400 16px 'Figtree',sans-serif;color:#2F3020;display:flex;align-items:center}
.btn{height:48px;padding:0 24px;border:none;border-radius: 999px;background:#4F5121;color:#FFFFFF;font: 500 15px 'Figtree',sans-serif;display:inline-flex;align-items:center;text-decoration:none}
.btn.soft{background:#E7E4DA;color:#2F3020}
</style>
<style>body{margin:0}</style>
</head>
<body>
<!-- Board: 1.7 New folder dialog ★ NEW · designed width 560px · exported from the design canvas, reference only -->
<div role="dialog" aria-label="New folder" style="width: 560px; box-sizing: border-box; background: #F9F8F4; color: #2F3020; font-family: 'Figtree', sans-serif; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-family: 'Literata', serif; font-weight: 400; font-size: 28px">New folder</h1>
    <button aria-label="Close" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: #E7E4DA; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F3020" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>
  <label><span class="fl">Name</span><div class="fld">Design leadership</div></label>
  <div style="display: flex; justify-content: flex-end; gap: 8px"><button class="btn soft">Cancel</button><a href="FolderEmpty.html" class="btn">Create folder</a></div>
</div>

<a href="../index.html" style="position:fixed;left:16px;bottom:16px;z-index:9999;height:40px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;background:#2F3020;color:#F9F8F4;border-radius:999px;font:500 13px 'Figtree',system-ui,sans-serif;text-decoration:none;box-shadow:0 6px 20px rgba(47,48,32,.3)"><span aria-hidden="true">&#8592;</span>All boards</a>
