        <span class="lbl" style="color:var(--ink-muted);padding-bottom:12px;border-bottom:2px solid var(--divider);margin-bottom:4px">Options</span>
        <label style="display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;border-bottom:1px solid var(--divider);cursor:pointer">
          <span>Save new posts to Later<br><span style="font-size:13px;color:var(--ink-muted)">For sources you always read</span></span>
          <input type="checkbox" id="source-auto" ${sc.autoLater?'checked':''} style="width:20px;height:20px;accent-color:var(--action);flex:none">
        </label>
        ${sc.kind==='video'?`<label style="display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;cursor:pointer">
          <span>Hide Shorts<br><span style="font-size:13px;color:var(--ink-muted)">Skip anything under a minute</span></span>
          <input type="checkbox" id="source-shorts" ${sc.hideShorts?'checked':''} style="width:20px;height:20px;accent-color:var(--action);flex:none">
        </label>`:''}
      </div>
      ${sourceError?`<p class="alert" role="alert">${esc(sourceError)}</p>`:''}
    </div>
    <div class="dfoot">
      <button class="btn soft" data-close="1">Cancel</button>
      <button class="btn" data-savesource="1">Save</button>
    </div>
  </div></div>`;
}

function overlaySearch(){
  const term = searchQ.trim().toLowerCase();
  let items = [], sources = [];
  if(term){
    items = live().filter(i=>{
      if(searchScope==='Feed') return !isLater(i) && !isArchived(i);
      if(searchScope==='Library') return isLater(i) || isArchived(i);
      if(searchScope==='Marks') return (i.highlights||[]).length || (i.note||'').trim() || (i.tags||[]).length;
      if(searchScope==='Sources') return false;
      return true;
    }).filter(i=>{
      // search reaches your own marks too: highlights, your note and your tags
      if(searchScope!=='Marks' && (i.title.toLowerCase().includes(term) || i.standfirst.toLowerCase().includes(term)
        || ((src(i)||{}).title||'').toLowerCase().includes(term))) return true;
      return (i.highlights||[]).some(h=>h.toLowerCase().includes(term))
        || (i.note||'').toLowerCase().includes(term)
        || (i.tags||[]).some(tg=>tg.toLowerCase().includes(term) || ('#'+tg).toLowerCase().includes(term));
    }).slice(0,8);
    sources = (searchScope==='Feed'||searchScope==='Library'||searchScope==='Marks') ? [] :
      S.sources.filter(s=>s.title.toLowerCase().includes(term)).slice(0,4);
  }
  const hl = text => {
    if(!term) return esc(text);
    const i = text.toLowerCase().indexOf(term);
    if(i<0) return esc(text);
    return esc(text.slice(0,i))+'<mark style="background:var(--problem);color:var(--ink);padding:0 2px">'+esc(text.slice(i,i+term.length))+'</mark>'+esc(text.slice(i+term.length));
  };
  return `<div class="scrim" data-scrim="1" style="align-items:flex-start;padding-top:8vh"><div class="search-box" role="dialog" aria-label="Search" aria-modal="true">
    <div style="flex:none;display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--divider)">
      ${I.search}
      <input id="search-q" value="${esc(searchQ)}" placeholder="Search everything you follow" autofocus
        style="flex:1;min-width:0;border:none;outline:none;font-size:18px;font-family:var(--sans);color:var(--ink);background:transparent">
      <button class="lk" data-close="1" style="border:1px solid var(--divider);border-radius:6px;padding:2px 6px;font-size:12px;color:var(--ink-muted)">esc</button>
    </div>
    <div style="flex:none;display:flex;gap:6px;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid var(--divider)">
      ${['Everywhere','Feed','Library','Marks','Sources'].map(s=>`<button class="chip ${searchScope===s?'on':''}" data-scope="${s}">${s==='Marks'?'Highlights &amp; Notes':s}</button>`).join('')}
    </div>
    <div class="search-hits">
      ${!term?`<p style="margin:0;padding:24px 12px;color:var(--ink-muted);font-size:15px">Type to search titles, descriptions, source names, your highlights, your notes and your tags.</p>`:''}
      ${term && !items.length && !sources.length?`<p style="margin:0;padding:24px 12px;color:var(--ink-muted);font-size:15px">Nothing matches “${esc(searchQ.trim())}”. Try fewer words.</p>`:''}
      ${items.map(i=>`<button class="mi" data-read="${i.id}" style="align-items:flex-start;padding:12px;min-height:56px">
        <span style="width:56px;aspect-ratio:16/9;border-radius:8px;background:${(src(i)||{}).color||'var(--m4)'};flex:none" aria-hidden="true"></span>
        <span style="display:flex;flex-direction:column;gap:4px;min-width:0">
          <span class="serif" style="font-size:17px;line-height:1.3">${hl(i.title)}</span>
          <span style="font-size:13px;color:var(--ink-muted)">${KIND[i.kind]} · ${esc((src(i)||{}).title||'')} · ${i.minutes} min</span>
          ${(()=>{
            const h = (i.highlights||[]).find(x=>x.toLowerCase().includes(term));
            if(h) return `<span style="font-size:13px;color:var(--ink-body);font-family:var(--serif);border-left:2px solid var(--action-light);padding-left:8px">${hl(h.slice(0,120))}</span>`;
            if((i.note||'').toLowerCase().includes(term)) return `<span style="font-size:13px;color:var(--ink-body)">Your note · ${hl(i.note.slice(0,120))}</span>`;
            const tg = (i.tags||[]).find(x=>x.toLowerCase().includes(term));
            if(tg) return `<span style="font-size:13px;color:var(--ink-body)">#${hl(tg)}</span>`;
            return '';
          })()}
        </span></button>`).join('')}
      ${sources.map(s=>`<button class="mi" data-go="sources">
        <span style="width:28px;height:28px;border-radius:999px;background:${s.color};flex:none" aria-hidden="true"></span>
        <span style="font-size:15px">${hl(s.title)}</span>
        <span style="margin-left:auto;font-size:13px;color:var(--ink-muted)">Source</span></button>`).join('')}
    </div>
  </div></div>`;
}

/* ---------------------------------------------------------------- render */
function render(){
  // A screen that fails to draw must say so. Without this, an error leaves the
  // previous screen up and the click looks like it did nothing.
  let body;
  try{
    body = V.view==='read' ? viewRead()
      : V.view==='feed' ? viewFeed()
      : V.view==='library' ? viewLibrary()
      : V.view==='listen' ? viewListen()
      : V.view==='sources' ? viewSources()
      : V.view==='settings' ? viewSettings()
      : viewHome();
  }catch(err){
    console.error(err);
    body = `<div class="wrap"><div class="empty" style="margin-top:24px">
      <h2>This screen hit a problem.</h2>
      <p>Something in the saved sample data did not fit this version. Resetting fixes it. Nothing real is lost, it is all sample data.</p>
      <button class="btn" data-seed="demo">Reset sample data</button>
    </div></div>`;
  }
  // the site header is on every page, the reader included
  const chrome = header();
  const foot = V.view==='read' ? '' : `<div class="wrap"><p class="note" style="padding-block:0 32px">
    Prototype on sample data in your browser. <button class="lk" data-go="settings">Settings</button> can reset it or empty it to see day one.</p></div>`;
  document.getElementById('app').innerHTML = chrome + body + foot + playerHTML()
    + (V.overlay==='add' ? overlayAdd() : V.overlay==='search' ? overlaySearch()
      : V.overlay==='folders' ? overlayFolders()
      : V.overlay==='newfolder' ? overlayNewFolder()
      : V.overlay==='renamefolder' ? overlayRenameFolder()
      : V.overlay==='deletefolder' ? overlayDeleteFolder()
      : V.overlay==='editsource' ? overlayEditSource() : '');
  wireReaderProgress();
  if(V.view==='read' && V.jump!=null && V.jump!=='top'){
    const target = V.jump==='note' ? document.getElementById('reader-notes')
      : document.querySelector('mark[data-hmark="'+V.itemId+'|'+V.jump+'"]');
    V.jump = null;
    if(target) requestAnimationFrame(()=>target.scrollIntoView({block:'center'}));
  } else if(V.jump==='top'){ V.jump = null; }
  wireHeaderShadow();
  const focus = document.getElementById(V.overlay==='add' ? 'add-url' : V.overlay==='search' ? 'search-q'
    : (V.overlay==='newfolder' || V.overlay==='renamefolder') ? 'folder-name' : '');
  if(focus){ focus.focus(); if(focus.value) focus.setSelectionRange(focus.value.length, focus.value.length); }
}

/* ---------------------------------------------------------------- actions */
/* Back goes to the exact place you opened the piece from. */
function goBack(){
  const f = V.readFrom, tag = V.readTag, folder = V.readFolder, source = V.readSource;
  if(f === 'tag') return go('library', {tag});
  if(f === 'library') return go('library', {shelf:'later'});
  if(f === 'archive') return go('library', {shelf:'archive'});
  if(f === 'highlights') return go('library', {shelf:'highlights'});
  if(f === 'home' || f === 'listen' || f === 'sources' || f === 'settings') return go(f);
  return go('feed', {folder: folder || null, source: source || null});
}

function doAct(verb, id){
  const it = S.items.find(i=>i.id===id);
  if(!it) return;
  const before = {seenAt:it.seenAt, savedAt:it.savedAt, archivedAt:it.archivedAt, deletedAt:it.deletedAt};
  const now = new Date().toISOString();
  const kind = KIND[it.kind];
  let text = '';
  if(verb==='later'){
    if(it.savedAt){ patch(id,{savedAt:null}); text=kind+' removed from Later.'; }
    else { patch(id,{savedAt:now}); text=kind+' saved for later.'; }
  } else if(verb==='archive'){
    patch(id,{archivedAt:now, seenAt:it.seenAt||now}); text=kind+' archived.';
  } else if(verb==='unarchive'){
    patch(id,{archivedAt:null}); text=kind+' moved out of the Archive.';
  } else if(verb==='seen'){
    if(it.seenAt){ patch(id,{seenAt:null}); text=kind+' marked as unseen.'; }
    else { patch(id,{seenAt:now}); text=kind+' marked as seen.'; }
  } else if(verb==='delete'){
    patch(id,{deletedAt:now}); text=kind+' deleted.';
  }
  V.menuFor = null;
  showToast(text, ()=>{ patch(id, before); });
  if(V.view==='read' && (verb==='archive'||verb==='delete')){
    setTimeout(()=>{ if(V.view==='read' && V.itemId===id) goBack(); }, 450);
  }
  render();
}

function followSource(){
  const input = document.getElementById('add-url');
  const folderSel = document.getElementById('add-folder');
  const url = (input ? input.value : '').trim();
  addError = null;
  if(!url){ addError = 'Paste a link first.'; render(); return; }
  if(!/\./.test(url)){ addError = "That doesn't look like a link. Try something like fieldnotes.example or a YouTube channel."; render(); return; }
  if(S.sources.some(s=>url.includes(s.site))){ addError = "You already follow this one. It's in your Sources list."; render(); return; }
  const host = url.replace(/^https?:\/\//,'').split('/')[0] || 'example.com';
  const nameField = document.getElementById('add-name');
  const typedName = (nameField ? nameField.value : '').trim();
  const name = typedName || host.replace(/^www\./,'').split('.')[0].replace(/[-_]/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
  const id = 'src-'+Date.now();
  const palette = ['var(--m1)','var(--m2)','var(--m3)','var(--m4)','var(--m6)'];
  const color = palette[Math.floor(Math.random()*palette.length)];
  const folderId = folderSel ? folderSel.value : '';
  const autoField = document.getElementById('add-auto');
  S.sources.push({id, title:name, kind:'article', site:host, color, status:'ok',
    folders:folderId?[folderId]:[], autoLater:!!(autoField && autoField.checked)});
  const now = Date.now();
  [0,1,2].forEach(n=>{
    const title = [ 'Welcome to '+name, name+': the most recent post', name+': something from last week' ][n];
    S.items.unshift({id:id+'-item-'+n, sourceId:id, title,
      standfirst:'Pulled in when you followed this source.',
      body:['This stands in for a real post from '+name+'.','In the finished version the text comes from the feed, cleaned up for reading.'],
      kind:'article', minutes:4+n*2,
      publishedAt:new Date(now-(n+1)*5*3600000).toISOString(),
      seenAt:null, savedAt:null, archivedAt:null, deletedAt:null});
  });
  save();
  V.overlay = null; addError = null; addUrl = '';
  V.view = 'feed'; V.folder = null;
  render();
  const fname = folderId ? (S.folders.find(f=>f.id===folderId)||{}).name : null;
  showToast(name + (fname ? ' added to ' + fname + '.' : ' added to your feed.'), ()=>{
    S.sources = S.sources.filter(s=>s.id!==id);
    S.items = S.items.filter(i=>i.sourceId!==id);
    save();
  });
}

function renameFolder(){
  const field = document.getElementById('folder-name');
  const name = (field ? field.value : '').trim();
  const f = S.folders.find(x=>x.id===V.editFolder);
  folderError = null;
  if(!f){ V.overlay = null; render(); return; }
  if(!name){ folderError = 'A folder needs a name.'; render(); return; }
  if(S.folders.some(x=>x.id!==f.id && x.name.toLowerCase()===name.toLowerCase())){
    folderError = 'You already have a folder with that name.'; render(); return;
  }
  const old = f.name; f.name = name; save();
  V.overlay = null; V.editFolder = null; render();
  showToast('Renamed to ' + name + '.', ()=>{ f.name = old; save(); });
}

function createFolder(){
  const field = document.getElementById('folder-name');
  const name = (field ? field.value : '').trim();
  folderError = null;
  if(!name){ folderError = 'Give the folder a name first.'; render(); return; }
  if(S.folders.some(f=>f.name.toLowerCase() === name.toLowerCase())){
    folderError = 'You already have a folder with that name.'; render(); return;
  }
  const id = 'folder-' + Date.now();
  S.folders.push({id, name});
  save();
  V.overlay = null; folderError = null;
  V.view = 'feed'; V.folder = id;
  render();
  showToast(name + ' created.', ()=>{
    S.folders = S.folders.filter(f=>f.id !== id);
    S.sources.forEach(sc=>{ sc.folders = sc.folders.filter(x=>x !== id); });
    if(Array.isArray(S.homeFolders)) S.homeFolders = S.homeFolders.filter(x=>x !== id);
    save();
    V.folder = null; V.view = 'feed';
  });
}

/* ---------------------------------------------------------------- events */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-overlay],[data-folder],[data-shelf],[data-read],[data-act],[data-menu],[data-tab],[data-filter],[data-fk],[data-ff],[data-fl],[data-fsrc],[data-ftag],[data-fattention],[data-close],[data-scrim],[data-follow],[data-scope],[data-sfeed],[data-seed],[data-size],[data-back],[data-play],[data-pp],[data-pclose],[data-fadd],[data-fremove],[data-goaledit],[data-goalsave],[data-sizeopen],[data-newfolder],[data-frename],[data-fdelete],[data-fsaverename],[data-fconfirmdelete],[data-tagstart],[data-untag],[data-highlight],[data-unhigh],[data-readat],[data-hmark],[data-focusnote],[data-unsource],[data-addmode],[data-saveone],[data-saveto],[data-htab],[data-railtag],[data-libtag],[data-tagopen],[data-tagpick],[data-hexport],[data-sub],[data-subback],[data-smenu],[data-ssub],[data-spausesub],[data-spause],[data-sfolder],[data-srename],[data-savesource],[data-unfollow],[data-source],[data-movefolder],[data-movenew],[data-mute],[data-copy],[data-original],[data-soon]');
  if(!t){ if(V.menuFor || V.filterOpen || V.sizeOpen){ V.menuFor = null; V.menuSub = null; V.filterOpen = false; V.sizeOpen = false; render(); } return; }

  const d = t.dataset;
  if(d.scrim !== undefined && t === e.target){ V.overlay = null; addError = null; render(); return; }
  if(d.close !== undefined){ V.overlay = null; addError = null; folderError = null; sourceError = null; V.editSource = null; render(); return; }
  if(d.go){ V.overlay = null; go(d.go); return; }
  if(d.overlay){ V.overlay = d.overlay; addError = null; render(); return; }
  if(d.folder !== undefined && d.folder !== ''){ go('feed', {folder:d.folder}); return; }
  if(d.folder === ''){ go('feed', {folder:null}); return; }
  if(d.shelf){ go('library', {shelf:d.shelf}); return; }
  if(d.source){ const id = d.source; go('feed', {source:id}); return; }
  if(d.unsource){ go('feed'); return; }
  if(d.smenu){ V.menuFor = V.menuFor==='src-'+d.smenu ? null : 'src-'+d.smenu; render(); return; }
  if(d.ssub){ V.menuFor = 'srcfolder-'+d.ssub; render(); return; }
  if(d.spausesub){ V.menuFor = 'srcpause-'+d.spausesub; render(); return; }
  if(d.spause){
    const [id, days] = d.spause.split('|'); const n = Number(days);
    const sc = S.sources.find(x=>x.id===id);
    if(sc){
      const before = {muted:sc.muted, pausedUntil:sc.pausedUntil};
      sc.muted = true; sc.pausedUntil = n ? new Date(Date.now() + n*86400000).toISOString() : null; save();
      const label = (PAUSES.find(x=>x[0]===n)||[0,''])[1];
      showToast(sc.title + (n ? ' paused for ' + label + '.' : ' paused until you resume it.'), ()=>{ Object.assign(sc, before); save(); });
    }
    V.menuFor = null; render(); return;
  }
  if(d.sfolder){
    const [sid, fid] = d.sfolder.split('|');
    const sc = S.sources.find(x=>x.id===sid);
    const fname = (S.folders.find(f=>f.id===fid)||{}).name;
    if(sc){
      const had = sc.folders.includes(fid);
      sc.folders = had ? sc.folders.filter(x=>x!==fid) : [...sc.folders, fid];
      save();
      showToast(sc.title + (had ? ' removed from ' : ' added to ') + fname + '.', ()=>{
        const back = S.sources.find(x=>x.id===sid);
        if(back) back.folders = had ? [...back.folders, fid] : back.folders.filter(x=>x!==fid);
        save();
      });
    }
    V.menuFor = null; render(); return;
  }
  if(d.srename){ V.menuFor = null; V.editSource = d.srename; V.overlay = 'editsource'; render(); return; }
  if(d.savesource){
    const sc = S.sources.find(x=>x.id===V.editSource);
    const nameField = document.getElementById('source-name');
    const autoField = document.getElementById('source-auto');
    const shortsField = document.getElementById('source-shorts');
    if(sc){
      const name = (nameField ? nameField.value : '').trim();
      if(!name){ sourceError = 'A source needs a name.'; render(); return; }
      sc.title = name;
      sc.autoLater = !!(autoField && autoField.checked);
      sc.hideShorts = !!(shortsField && shortsField.checked);
      save();
      V.overlay = null; V.editSource = null; sourceError = null; render();
      showToast(name + ' updated.');
    }
    return;
  }
  if(d.unfollow){
    const sc = S.sources.find(x=>x.id===d.unfollow);
    if(sc){
      const keptSource = {...sc, folders:[...sc.folders]};
      const keptItems = S.items.filter(i=>i.sourceId===sc.id);
      S.sources = S.sources.filter(x=>x.id!==sc.id);
      S.items = S.items.filter(i=>i.sourceId!==sc.id);
      save();
      showToast(keptSource.title + ' unfollowed, with ' + keptItems.length + ' items.', ()=>{
        S.sources.push(keptSource);
        S.items = keptItems.concat(S.items);
        save();
      });
    }
    V.menuFor = null; render(); return;
  }
  if(d.readat){
    // open the piece and land on the highlight, not at the top
    const [id, n] = d.readat.split('|');
    V.overlay = null;
    go('read', {itemId:id, readFrom:'highlights', jump: (n==='top'||n==='note') ? n : Number(n)});
    const it = S.items.find(i=>i.id===id); if(it && !it.seenAt) patch(it.id,{seenAt:new Date().toISOString()});
    return;
  }
  if(d.read){
    const from = V.view==='home' ? 'home' : V.view==='library' ? (V.tag?'tag':V.shelf==='archive'?'archive':V.shelf==='highlights'?'highlights':'library')
      : V.view==='listen' ? 'listen' : V.view==='sources' ? 'sources' : V.view==='settings' ? 'settings' : 'feed';
    V.readFolder = V.view==='feed' ? V.folder : null; V.readSource = V.view==='feed' ? V.source : null;
    const readTag = V.tag, readFolder = V.readFolder, readSource = V.readSource; V.overlay = null; go('read', {itemId:d.read, readFrom:from, readTag, readFolder, readSource}); const it = S.items.find(i=>i.id===d.read); if(it && !it.seenAt){ patch(it.id,{seenAt:new Date().toISOString()}); } return; }
  if(d.act){ const [verb,id] = d.act.split('|'); doAct(verb,id); return; }
  if(d.menu){ V.menuFor = V.menuFor===d.menu ? null : d.menu; V.menuSub = null; render(); return; }
  if(d.sub){ V.menuSub = d.sub; render(); return; }
  if(d.subback){ V.menuSub = null; render(); return; }
  if(d.movefolder){
    const [itemId, folderId] = d.movefolder.split('|');
    const it = S.items.find(i=>i.id===itemId);
    const sc = it ? S.sources.find(x=>x.id===it.sourceId) : null;
    const fname = (S.folders.find(f=>f.id===folderId)||{}).name;
    if(sc && !sc.folders.includes(folderId)){
      sc.folders.push(folderId); save();
      showToast(sc.title + ' added to ' + fname + '.', ()=>{ sc.folders = sc.folders.filter(x=>x!==folderId); save(); });
    } else if(sc){
      showToast(sc.title + ' is already in ' + fname + '.');
    }
    V.menuFor = null; V.menuSub = null; render(); return;
  }
  if(d.movenew){ V.menuFor = null; V.menuSub = null; V.overlay = 'newfolder'; render(); return; }
  if(d.mute){
    const sc = S.sources.find(x=>x.id===d.mute);
    // the same control pauses and resumes, so it has to read the current state
    if(sc){ const was = isPaused(sc), before = {muted:sc.muted, pausedUntil:sc.pausedUntil};
      sc.muted = !was; sc.pausedUntil = null; save();
      showToast(sc.title + (was ? ' resumed.' : ' paused until you resume it.'), ()=>{ Object.assign(sc, before); save(); }); }
    V.menuFor = null; render(); return;
  }
  if(d.copy){
    const it = S.items.find(i=>i.id===d.copy);
    const url = 'https://' + ((src(it||{})||{}).site || 'example.com') + '/' + (it?it.id:'');
    V.menuFor = null; render();
    // clipboard access can be refused, so only claim success when it succeeded
    let done = null;
    try{ done = navigator.clipboard && navigator.clipboard.writeText(url); }catch(_){ done = null; }
    if(done && typeof done.then === 'function'){
      done.then(()=>showToast('Link copied.')).catch(()=>showToast('Your browser blocked copying. The link is ' + url));
    } else {
      showToast('Your browser blocked copying. The link is ' + url);
    }
    return;
  }
  if(d.original){ V.menuFor = null; render(); showToast('Opens the original page in a new tab.'); return; }
  if(d.soon){ const what = d.soon; V.menuFor = null; render(); showToast(what + ' arrive in phase 2 of the build.'); return; }
  if(d.tab){ const [key,tab] = d.tab.split('|'); setPref(key,{tab}); return; }
  if(d.filter === 'toggle'){ V.filterOpen = !V.filterOpen; render(); return; }
  if(d.filter && d.filter.startsWith('clear|')){ setPref(d.filter.split('|')[1], {kinds:[], folder:'Any', length:'Any', attention:false, only:'Everything', tag:null, sources:[]}); return; }
  if(d.htab){ setPref('high', {only:d.htab}); return; }
  if(d.tagopen){
    const from = V.view==='library' ? (V.shelf==='archive'?'archive':'library') : V.view==='listen' ? 'listen' : 'feed';
    const readFolder = V.view==='feed' ? V.folder : null, readSource = V.view==='feed' ? V.source : null;
    go('read', {itemId:d.tagopen, readFrom:from, readFolder, readSource, tagging:d.tagopen});
    const f = document.getElementById('tag-input'); if(f){ f.scrollIntoView({block:'center'}); f.focus(); }
    return;
  }
  if(d.libtag){ go('library', {tag:d.libtag}); return; }
  if(d.railtag){
    const [key, tg] = d.railtag.split('|'); const p = prefs(key,{});
    const off = key==='high' ? 'Any' : null;
    setPref(key, {tag: p.tag===tg ? off : tg}); return;
  }
  if(d.tagpick){ go('library', {shelf:'highlights'}); setPref('high', {tag:d.tagpick, group:'Item'}); return; }
  if(d.hexport){
    const text = annotated().map(i=>{
      const hs = (i.highlights||[]).map(h=>'  - '+h).join('\n');
      return i.title + ' (' + ((src(i)||{}).title||'') + ')\n' + hs + ((i.note||'').trim()?'\n  Note: '+i.note:'');
    }).join('\n\n');
    let done = null;
    try{ done = navigator.clipboard && navigator.clipboard.writeText(text); }catch(_){ done = null; }
    if(done && typeof done.then === 'function'){
      done.then(()=>showToast('Highlights and notes copied as text.')).catch(()=>showToast('Your browser blocked copying. Select the text on the page instead.'));
    } else { showToast('Your browser blocked copying. Select the text on the page instead.'); }
    return;
  }
  if(d.fk){ const [key,kind] = d.fk.split('|'); const p = prefs(key,{}); const kinds = p.kinds||[];
    if(kind==='all'){ setPref(key,{kinds:[]}); return; }
    setPref(key,{kinds: kinds.includes(kind) ? kinds.filter(k=>k!==kind) : [...kinds,kind]}); return; }
  if(d.fsrc){
    // no boxes ticked means everything, so the first tick starts from that source alone
    const [key,id] = d.fsrc.split('|'); const p = prefs(key,{}); const on = p.sources||[];
    setPref(key,{sources: on.length===0 ? [id] : on.includes(id) ? on.filter(x=>x!==id) : [...on,id]});
    return;
  }
  if(d.ftag){ const [key,tg] = d.ftag.split('|'); const p = prefs(key,{}); setPref(key,{tag: p.tag===tg ? null : tg}); return; }
  if(d.ff){ const [key,f] = d.ff.split('|'); setPref(key,{folder:f}); return; }
  if(d.fattention){ const pr = prefs(d.fattention,{}); setPref(d.fattention,{attention: d.off ? false : !pr.attention}); return; }
  if(d.fl){ const [key,l] = d.fl.split('|'); const p = prefs(key,{}); setPref(key,{length: p.length===l ? 'Any' : l}); return; }
  if(d.addmode){ addMode = d.addmode; addError = null; render(); return; }
  if(d.saveto){ saveTo = d.saveto; render(); return; }
  if(d.saveone){ saveOneThing(); return; }
  if(d.follow){ followSource(); return; }
  if(d.newfolder){ createFolder(); return; }
  if(d.frename){ V.menuFor = null; V.editFolder = d.frename; folderError = null; V.overlay = 'renamefolder'; render(); return; }
  if(d.fdelete){ V.menuFor = null; V.editFolder = d.fdelete; V.overlay = 'deletefolder'; render(); return; }
  if(d.fsaverename){ renameFolder(); return; }
  if(d.fconfirmdelete){
    const f = S.folders.find(x=>x.id===V.editFolder);
    if(f){
      const at = S.folders.indexOf(f);
      const had = S.sources.filter(sc=>sc.folders.includes(f.id)).map(sc=>sc.id);
      const home = Array.isArray(S.homeFolders) ? S.homeFolders.slice() : null;
      S.folders = S.folders.filter(x=>x.id!==f.id);
      S.sources.forEach(sc=>{ sc.folders = sc.folders.filter(x=>x!==f.id); });
      if(home) S.homeFolders = home.filter(x=>x!==f.id);
      save();
      V.overlay = null; V.editFolder = null;
      go('feed');
      showToast(f.name + ' deleted. Everything in it is still in your Feed.', ()=>{
        S.folders.splice(at, 0, f);
        S.sources.forEach(sc=>{ if(had.includes(sc.id) && !sc.folders.includes(f.id)) sc.folders.push(f.id); });
        if(home) S.homeFolders = home;
        save();
      });
    }
    return;
  }
  if(d.scope){ searchScope = d.scope; render(); return; }
  if(d.seed){ S = d.seed==='demo' ? makeSeed() : emptySeed(); save();
    V.prefs = {}; V.player = null;
    if(d.seed==='empty'){ go('home'); } else { render(); }
    showToast(d.seed==='demo' ? 'Sample content restored.' : 'Everything cleared.');
    return; }
  if(d.fadd){ homeFolders(); if(S.homeFolders.length < HOME_MAX && !S.homeFolders.includes(d.fadd)){ S.homeFolders.push(d.fadd); save(); } render(); return; }
  if(d.fremove){ homeFolders(); S.homeFolders = S.homeFolders.filter(id=>id!==d.fremove); save(); render(); return; }
  if(d.fup || d.fdown){
    homeFolders();
    const id = d.fup || d.fdown, i = S.homeFolders.indexOf(id), j = d.fup ? i-1 : i+1;
    if(i>-1 && j>-1 && j<S.homeFolders.length){
      S.homeFolders.splice(j, 0, S.homeFolders.splice(i,1)[0]); save();
    }
    render(); return;
  }
  if(d.goaledit){ V.editGoal = true; render(); const f = document.getElementById('goal-input'); if(f){ f.focus(); f.select(); } return; }
  if(d.goalsave){
    const f = document.getElementById('goal-input');
    const n = f ? parseInt(f.value, 10) : NaN;
    if(!isNaN(n)) { S.settings.readingGoal = Math.min(240, Math.max(5, n)); save(); }
    V.editGoal = false; render(); return;
  }
  if(d.play){
    // starting playback is not finishing it, so this does not mark the item seen
    if(V.player === d.play){ V.playing = !V.playing; } else { V.player = d.play; V.playing = true; }
    render(); return; }
  if(d.pp){ V.playing = !V.playing; render(); return; }
  if(d.pclose){ V.player = null; V.playing = false; render(); return; }
  if(d.tagstart){ V.tagging = d.tagstart; render(); const f = document.getElementById('tag-input'); if(f) f.focus(); return; }
  if(d.untag){
    const [id, tag] = d.untag.split('|');
    const item = S.items.find(i=>i.id===id);
    if(item){ item.tags = (item.tags||[]).filter(t=>t!==tag); save(); }
    render(); return;
  }
  if(d.highlight){
    const item = S.items.find(i=>i.id===d.highlight);
    const text = (window.getSelection ? String(window.getSelection()).trim() : '');
    if(!item) return;
    if(!text){ showToast('Select some text in the article first.'); return; }
    item.highlights = [...(item.highlights||[]), text.slice(0,300)];
    save();
    if(window.getSelection) try{ window.getSelection().removeAllRanges(); }catch(_){}
    closeSelBar(); render();
    showToast('Highlight saved to Library.', ()=>{ item.highlights = (item.highlights||[]).slice(0,-1); save(); });
    return;
  }
  if(d.hmark){
    // clicking a highlight in the text offers to take it off, where it is
    const [id, n] = d.hmark.split('|');
    const r = t.getBoundingClientRect();
    showSelBar(r, `<button class="danger" data-unhigh="${id}|${n}">${I.trash}Remove highlight</button>
      <button data-focusnote="${id}">${I.noteicon}Add a note</button>`);
    return;
  }
  if(d.focusnote){
    closeSelBar();
    const box = document.getElementById('reader-notes');
    if(box){ box.scrollIntoView({block:'center', behavior:'smooth'}); box.focus(); }
    return;
  }
  if(d.unhigh){
    const [id, n] = d.unhigh.split('|');
    const item = S.items.find(i=>i.id===id);
    if(item){ const kept = item.highlights[Number(n)];
      item.highlights = item.highlights.filter((_,k)=>k!==Number(n)); save(); closeSelBar(); render();
      showToast('Highlight removed.', ()=>{ item.highlights = [...(item.highlights||[]), kept]; save(); });
    }
    return;
  }
  if(d.sizeopen){ V.sizeOpen = !V.sizeOpen; render(); return; }
  if(d.size){ V.readSize = parseInt(d.size,10); V.sizeOpen = false;
    S.settings.readerSize = V.readSize; save(); render(); return; }
  if(d.back){ goBack(); return; }
});

document.addEventListener('dragstart', e => {
  const r = e.target.closest && e.target.closest('[data-fdrag]');
  if(!r) return;
  V._drag = r.dataset.fdrag;
  r.classList.add('dragging');
  if(e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', V._drag); }catch(_){} }
});
document.addEventListener('dragover', e => {
  const r = e.target.closest && e.target.closest('[data-fdrag]');
  if(!r || !V._drag) return;
  e.preventDefault();
  r.classList.add('dropping');
});
document.addEventListener('dragleave', e => {
  const r = e.target.closest && e.target.closest('[data-fdrag]');
  if(r) r.classList.remove('dropping');
});
document.addEventListener('drop', e => {
  const r = e.target.closest && e.target.closest('[data-fdrag]');
  if(!r || !V._drag) return;
  e.preventDefault();
  const from = V._drag, to = r.dataset.fdrag;
  V._drag = null;
  if(from !== to){
    homeFolders();
    const a = S.homeFolders.indexOf(from), b = S.homeFolders.indexOf(to);
    if(a > -1 && b > -1){ S.homeFolders.splice(b, 0, S.homeFolders.splice(a, 1)[0]); save(); }
  }
  render();
});
document.addEventListener('dragend', () => { if(V._drag){ V._drag = null; render(); } });

document.addEventListener('change', e => {
  const d = e.target.dataset;
  if(d.readfolder){
    const item = S.items.find(i=>i.id===d.readfolder);
    const sc = item ? S.sources.find(x=>x.id===item.sourceId) : null;
    const fid = e.target.value;
    if(sc){
      sc.folders = fid ? [fid, ...sc.folders.filter(x=>x!==fid)] : [];
      save();
      const fname = fid ? (S.folders.find(f=>f.id===fid)||{}).name : null;
      showToast(sc.title + (fname ? ' moved to ' + fname + '.' : ' taken out of its folders.'));
    }
    return;
  }
  if(d.check){
    S.settings.checkEvery = parseInt(e.target.value, 10) || 30; save(); render();
    showToast('We will look for new posts ' + checkWords() + '.');
    return;
  }
  if(d.pref){ const [key,field] = d.pref.split('|'); setPref(key,{[field]: e.target.value}); }
  if(d.set){ S.settings[d.set] = e.target.checked; save(); }
});

document.addEventListener('input', e => {
  if(e.target.id === 'search-q'){ searchQ = e.target.value; render(); }
  if(e.target.id === 'add-url'){
    addUrl = e.target.value;
    const {typed, host, guess} = addParts(addUrl);
    const card = document.getElementById('add-preview');
    if(card) card.outerHTML = addPreview(addMode==='save', typed, host, guess);
    // the display name follows the link until you type your own
    const nm = document.getElementById('add-name');
    if(nm && !nm.dataset.touched) nm.value = guess;
  }
  if(e.target.id === 'add-name'){ e.target.dataset.touched = '1'; }
  if(e.target.dataset && e.target.dataset.note){
    const item = S.items.find(i=>i.id===e.target.dataset.note);
    if(item){ item.note = e.target.value; save(); }   // saves as you type, no button
  }
});

document.addEventListener('keydown', e => {
  // arrow keys reorder a focused folder, for keyboards and touch
  const row = document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-fdrag]');
  if(row && (e.key === 'ArrowUp' || e.key === 'ArrowDown')){
    e.preventDefault();
    homeFolders();
    const id = row.dataset.fdrag, i = S.homeFolders.indexOf(id), j = e.key === 'ArrowUp' ? i-1 : i+1;
    if(i > -1 && j > -1 && j < S.homeFolders.length){
      S.homeFolders.splice(j, 0, S.homeFolders.splice(i, 1)[0]); save(); render();
      const next = document.querySelector('[data-fdrag="'+id+'"]'); if(next) next.focus();
    }
    return;
  }
  if((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.classList
     && document.activeElement.classList.contains('plain')){
    const id = document.activeElement.dataset.read;
    if(id){ e.preventDefault(); go('read', {itemId:id});
      const it = S.items.find(i=>i.id===id); if(it && !it.seenAt) patch(it.id,{seenAt:new Date().toISOString()});
      return; }
  }
  if(e.key === 'Escape'){
    if(V.overlay){ V.overlay = null; addError = null; folderError = null; sourceError = null; V.editSource = null; render(); }
    else if(V.menuFor || V.filterOpen || V.sizeOpen){ V.menuFor = null; V.menuSub = null; V.filterOpen = false; V.sizeOpen = false; render(); }
  }
  if(e.key === 'Enter' && document.activeElement && document.activeElement.id === 'goal-input'){
    const n = parseInt(document.activeElement.value, 10);
    if(!isNaN(n)) { S.settings.readingGoal = Math.min(240, Math.max(5, n)); save(); }
    V.editGoal = false; render(); return;
  }
  if(e.key === 'Escape' && V.editGoal){ V.editGoal = false; render(); return; }
  if(e.key === 'Enter' && document.activeElement && document.activeElement.id === 'tag-input'){
    const value = document.activeElement.value.trim().replace(/^#/,'');
    const item = S.items.find(i=>i.id===V.tagging);
    if(item && value){
      if(!(item.tags||[]).includes(value)){ item.tags = [...(item.tags||[]), value]; save(); }
    }
    V.tagging = null; render(); return;
  }
  if(e.key === 'Escape' && V.tagging){ V.tagging = null; render(); return; }
  if(e.key === 'Enter' && V.overlay === 'newfolder' && document.activeElement && document.activeElement.id === 'folder-name'){
    createFolder(); return;
  }
  if(e.key === 'Enter' && V.overlay === 'renamefolder' && document.activeElement && document.activeElement.id === 'folder-name'){
    renameFolder(); return;
  }
  if(e.key === 'Enter' && V.overlay === 'add' && document.activeElement && document.activeElement.id === 'add-url'){
    followSource();
  }
});

/* the header band shows its hairline only once the page has scrolled */
function wireHeaderShadow(){
  if(V._hscroll){ window.removeEventListener('scroll', V._hscroll); V._hscroll = null; }
  const band = document.getElementById('topband');
  if(!band) return;
  const update = ()=>{
    band.classList.toggle('stuck', window.scrollY > 4);
    // the reader's own bar sticks directly under the site header
    // on a phone the site header scrolls away, so the reader bar sticks to the very top
    const sticky = getComputedStyle(band).position === 'sticky';
    document.documentElement.style.setProperty('--hh', (sticky ? band.offsetHeight : 0) + 'px');
  };
  V._hscroll = update;
  window.addEventListener('scroll', update, {passive:true});
  update();
}

/* ------------------------------------------------- the selection bar
   Highlighting happens where your cursor is, not in the sidebar: select a
   sentence and the bar appears over it. Clicking a highlight offers to remove it. */
function closeSelBar(){ const l = document.getElementById('sel-layer'); if(l) l.innerHTML = ''; }

function showSelBar(rect, buttons){
  const layer = document.getElementById('sel-layer');
  if(!layer) return;
  const top = rect.top + window.scrollY - 10;
  const left = rect.left + window.scrollX + rect.width/2;
  layer.innerHTML = `<div class="selbar" style="top:${top}px;left:${left}px">${buttons}</div>`;
}

function selectionInBody(){
  const sel = window.getSelection && window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const body = document.getElementById('read-body');
  if(!body) return null;
  const range = sel.getRangeAt(0);
  if(!body.contains(range.commonAncestorContainer.nodeType === 1
      ? range.commonAncestorContainer : range.commonAncestorContainer.parentNode)) return null;
  const text = String(sel).trim();
  if(text.length < 3) return null;
  return {text, rect:range.getBoundingClientRect()};
}

function offerHighlight(){
  if(V.view !== 'read') return closeSelBar();
  const got = selectionInBody();
  if(!got) return closeSelBar();
  showSelBar(got.rect, `<button data-highlight="${V.itemId}">${I.marker}Highlight</button>
    <button data-focusnote="${V.itemId}">${I.noteicon}Add a note</button>`);
}

document.addEventListener('mouseup', ()=>{ setTimeout(offerHighlight, 0); });
document.addEventListener('keyup', e => { if(e.shiftKey || e.key==='Shift') offerHighlight(); });

/* the reader hairline tracks real scroll position */
function wireReaderProgress(){
  if(V._pscroll){ window.removeEventListener('scroll', V._pscroll); V._pscroll = null; }
  if(V.view !== 'read') return;
  const el = document.getElementById('read-progress');
  if(!el) return;
  const update = ()=>{
    const h = document.documentElement.scrollHeight - window.innerHeight;
    const pct = h > 0 ? Math.min(100, Math.max(0, (window.scrollY / h) * 100)) : 0;
    el.style.width = pct.toFixed(1) + '%';
  };
  V._pscroll = update;
  window.addEventListener('scroll', update, {passive:true});
  update();
}

/* open the view named in the artifact link, if any */
if(S.settings && S.settings.readerSize) V.readSize = S.settings.readerSize;
const h = (location.hash || '').replace('#','');
if(VIEWS.includes(h)) V.view = h;
render();
</script>
