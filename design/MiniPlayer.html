<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.8 Mini player, any page ★ NEW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&amp;family=Figtree:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=switch]:focus-visible{outline:2px solid #4F5121;outline-offset:2px}a{color:#2F3020}a:hover{color:#B23A26}
.ghost{height:18px;border-radius: 9px;background:#E7E4DA}
.ghostrow{display:flex;gap: 16px;align-items:center;padding: 16px 0;border-top:1px solid #D5D0C3}
.ghostrow i{width:120px;aspect-ratio:16/9;border-radius: 12px;background:#E7E4DA;display:block;flex:none}
.cb{width:44px;height:44px;border:none;border-radius: 22px;background:transparent;display:flex;align-items:center;justify-content:center}
.cap{font-size: 13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#5E5D46}
</style>
<style>body{margin:0}</style>
</head>
<body>
<!-- Board: 1.8 Mini player, any page ★ NEW · designed width 1280px · exported from the design canvas, reference only -->
<div style="background: #F9F8F4; color: #2F3020; font-family: 'Figtree', sans-serif; min-height: 100vh; position: relative; padding: 40px 72px 0; box-sizing: border-box">
  <p class="cap" style="margin: 0 0 16px">Any page · the player follows you while you browse</p>
  
  <div style="opacity: 0.55">
    <div class="ghost" style="width: 260px; height: 40px; border-radius: 12px; margin-bottom: 28px"></div>
    <div class="ghostrow"><i></i><div style="flex: 1"><div class="ghost" style="width: 70%"></div><div class="ghost" style="width: 30%; height: 12px; margin-top: 8px"></div></div></div>
    <div class="ghostrow"><i></i><div style="flex: 1"><div class="ghost" style="width: 55%"></div><div class="ghost" style="width: 25%; height: 12px; margin-top: 8px"></div></div></div>
    <div class="ghostrow"><i></i><div style="flex: 1"><div class="ghost" style="width: 62%"></div><div class="ghost" style="width: 35%; height: 12px; margin-top: 8px"></div></div></div>
    <div class="ghostrow"><i></i><div style="flex: 1"><div class="ghost" style="width: 48%"></div><div class="ghost" style="width: 28%; height: 12px; margin-top: 8px"></div></div></div>
  </div>

  <div role="dialog" aria-label="Queue" style="position: absolute; right: 72px; bottom: 112px; width: 400px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 16px 48px rgba(47, 48, 32, 0.22); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px"><span class="cap">Up next · 3</span><a href="Listen.html" style="font-size: 14px; color: #4F5121; font-weight: 500">Open Listen</a></div>
    <div style="display: flex; gap: 12px; align-items: center; min-height: 56px; border-top: 1px solid #D5D0C3"><span style="width: 64px; aspect-ratio: 16 / 9; border-radius: 10px; background: #45442A; flex: none"></span><span style="flex: 1; font-size: 15px">Strength training basics<br><span style="font-size: 12px; color: #5E5D46">Video · 12 min</span></span></div>
    <div style="display: flex; gap: 12px; align-items: center; min-height: 56px; border-top: 1px solid #D5D0C3"><span style="width: 64px; aspect-ratio: 16 / 9; border-radius: 10px; background: #CDCAA6; flex: none"></span><span style="flex: 1; font-size: 15px">Ten quiet minutes: Tuesday<br><span style="font-size: 12px; color: #5E5D46">Podcast · 10 min</span></span></div>
    <div style="display: flex; gap: 12px; align-items: center; min-height: 56px; border-top: 1px solid #D5D0C3"><span style="width: 64px; aspect-ratio: 16 / 9; border-radius: 10px; background: #DCD7E4; flex: none"></span><span style="flex: 1; font-size: 15px">Pricing when work is slow<br><span style="font-size: 12px; color: #5E5D46">Podcast · 38 min</span></span></div>
  </div>

  <div role="region" aria-label="Now playing" style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; width: 1000px; height: 72px; box-sizing: border-box; background: #4F5121; color: #FFFFFF; border-radius: 999px; padding: 0 12px 0 12px; display: flex; align-items: center; gap: 16px; box-shadow: 0 12px 32px rgba(47, 48, 32, 0.3)">
    <span style="width: 48px; height: 48px; border-radius: 12px; background: #DCD7E4; flex: none"></span>
    <span style="min-width: 0; flex: 0 1 240px; font-size: 14px; line-height: 1.3"><b style="font-weight: 600">The slow mornings episode</b><br><span style="color: #E8E6D2; font-size: 13px">The Slow Mornings Pod</span></span>
    <button class="cb" aria-label="Back 15 seconds"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"></path></svg></button>
    <button aria-label="Pause" style="width: 48px; height: 48px; border: none; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="#4F5121" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg></button>
    <button class="cb" aria-label="Forward 30 seconds"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v4h-4"></path></svg></button>
    <span style="font-size: 12px; color: #E8E6D2">18:42</span>
    <span style="flex: 1; height: 4px; border-radius: 2px; background: #6B6B2F"><span style="display: block; width: 45%; height: 4px; border-radius: 2px; background: #F08A6E"></span></span>
    <span style="font-size: 12px; color: #E8E6D2">41:10</span>
    <button style="height: 36px; padding: 0 12px; border: none; border-radius: 999px; background: #6B6B2F; color: #FFFFFF; font: 600 13px 'Figtree', sans-serif">1.2×</button>
    <button class="cb" aria-label="Queue" style="background: #6B6B2F"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h8M18 15v6l4-3z"></path></svg></button>
    <button class="cb" aria-label="Close player"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>

</div>
</body>
</html>
