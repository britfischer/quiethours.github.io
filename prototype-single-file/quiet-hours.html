<title>Quiet Hours</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: paper-warm reading app. Header, left rail of places, one column of rows. */
:root{
  --page:#f9f8f4; --card:#ffffff; --soft:#efeddd; --softer:#e8e6d2; --control:#e7e4da;
  --divider:#d5d0c3; --border:#cdcaa6;
  --ink:#2f3020; --ink-muted:#5e5d46; --ink-body:#4d4c38;
  --action:#4f5121; --action-light:#6b6b2f;
  --attention:#b23a26; --attention-deep:#8f2e1e; --coral:#f08a6e;
  --m1:#dcd7e4; --m2:#e8d6c8; --m3:#cdcaa6; --m4:#e2ded2; --m5:#45442a; --m6:#dcdac0;
  --problem:#f3e3de; --scrim:rgba(47,48,32,.45);
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --menu-shadow:0 16px 48px rgba(47,48,32,.22);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#1b1c14; --card:#24251b; --soft:#2d2e22; --softer:#343527; --control:#343527;
  --divider:#3d3e2e; --border:#4c4d39;
  --ink:#f1efe4; --ink-muted:#b3b19b; --ink-body:#d8d6c6;
  --action:#a3a95a; --action-light:#8d9350;
  --attention:#e8765c; --attention-deep:#f0937e; --coral:#f08a6e;
  --m1:#4b4556; --m2:#5b4639; --m3:#6a6848; --m4:#434434; --m5:#2c2d1e; --m6:#575937;
  --problem:#3d2a24; --scrim:rgba(8,9,5,.6);
  --menu-shadow:0 16px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#1b1c14; --card:#24251b; --soft:#2d2e22; --softer:#343527; --control:#343527;
  --divider:#3d3e2e; --border:#4c4d39;
  --ink:#f1efe4; --ink-muted:#b3b19b; --ink-body:#d8d6c6;
  --action:#a3a95a; --action-light:#8d9350;
  --attention:#e8765c; --attention-deep:#f0937e; --coral:#f08a6e;
  --m1:#4b4556; --m2:#5b4639; --m3:#6a6848; --m4:#434434; --m5:#2c2d1e; --m6:#575937;
  --problem:#3d2a24; --scrim:rgba(8,9,5,.6);
  --menu-shadow:0 16px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none}
a:hover{color:var(--attention)}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
button{font-family:inherit;color:inherit}
.serif{font-family:var(--serif)}
.wrap{max-width:1240px;margin:0 auto;width:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-block:20px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:22px;font-weight:500}
.nav{display:flex;flex-wrap:wrap;gap:6px;background:var(--control);padding:4px;border-radius:999px}
.nav button{padding:12px 18px;border-radius:999px;font-size:14px;border:none;background:none;cursor:pointer}
.nav button.on{background:var(--card);font-weight:500}
.ib{width:44px;height:44px;border-radius:999px;border:none;background:var(--control);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ib.bare{background:transparent}
.add{height:44px;padding:0 20px;border:none;background:var(--attention);color:#fff;border-radius:999px;font:500 14px var(--sans);cursor:pointer}

/* columns */
.columns{display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;padding-block:8px 96px}
.rail{flex:1 1 220px;max-width:260px;min-width:0;display:flex;flex-direction:column;gap:20px}
.col{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.side{display:flex;flex-direction:column;gap:2px}
.side button{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;border:none;background:none;font:400 16px var(--sans);cursor:pointer;text-align:left;width:100%}
.side button:hover{background:var(--softer)}
.side button.on{background:var(--action);color:var(--card);font-weight:600}
.side button.on::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--coral);flex:none}
.sh{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--divider);padding-top:4px;margin-bottom:4px}
.lbl{margin:0;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
h1.page{margin:0;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.2;text-wrap:balance}
h1.display{margin:0;font-family:var(--serif);font-weight:400;font-size:44px;line-height:1.15;text-wrap:balance}
.accent{color:var(--attention)}

/* control row */
.controls{margin-top:-14px;display:flex;flex-wrap:wrap;gap:4px 20px;align-items:center;justify-content:space-between;position:relative}
.tabs{display:flex;flex-wrap:wrap;gap:16px}
.tabs button{padding:12px 0 10px;background:none;border:none;font:400 15px var(--sans);color:var(--ink-muted);cursor:pointer}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--attention)}
.ctl{display:flex;align-items:center;gap:4px;color:var(--ink-muted);font-size:15px}
.ctl select{height:44px;border:none;background:transparent;color:var(--ink);font:500 15px var(--sans);cursor:pointer;max-width:9.5em}
.vr{width:1px;height:20px;background:var(--divider)}
.fbtn{height:44px;padding:0 16px;border:none;border-radius:999px;background:var(--soft);color:var(--action);font:600 14px var(--sans);display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.fbtn.on{background:var(--softer)}
.panel{position:absolute;top:56px;right:0;z-index:20;width:min(320px,calc(100vw - 32px));background:var(--card);border-radius:20px;box-shadow:var(--menu-shadow);padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.chip{font-size:13px;padding:6px 12px;background:var(--soft);border:none;border-radius:999px;cursor:pointer;font-family:var(--sans)}
.chip.on{background:var(--action);color:var(--card);font-weight:600}
.lk{color:var(--action);font-weight:500;font-size:14px;background:none;border:none;cursor:pointer;padding:0;font-family:var(--sans)}
.fgroup>span{font-size:13px;font-weight:600;display:block;margin-bottom:8px}
.fgroup>div{display:flex;flex-wrap:wrap;gap:6px}

/* rows */
.ghead{padding-bottom:8px;border-bottom:2px solid var(--divider)}
.list{display:flex;flex-direction:column;border-top:2px solid var(--divider)}
.row{display:flex;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--divider);position:relative;min-width:0}
.list>.row:first-child{border-top:none}
.dot{width:8px;height:8px;border-radius:999px;background:var(--attention);flex:none}
.dot.off{background:transparent}
.th{width:120px;aspect-ratio:16/9;max-width:100%;flex:none;border-radius:12px;background:var(--m4);display:flex;align-items:center;justify-content:center}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tt{font-family:var(--serif);font-size:20px;line-height:1.3;text-align:left;background:none;border:none;padding:0;cursor:pointer}
.tt:hover{color:var(--attention)}
.meta{font-size:13px;color:var(--ink-muted);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.b{height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;background:var(--soft);color:var(--action)}
.b.video{background:var(--action);color:var(--card)}
.b.podcast{background:var(--softer);color:var(--action)}
.fchip{font-size:12px;padding:3px 9px;background:var(--soft);border-radius:999px;flex:none;color:var(--ink-muted)}
.acts{display:flex;gap:6px;flex:none;opacity:0;transition:opacity .12s ease}
.row:hover .acts,.row:focus-within .acts{opacity:1}
.act{width:40px;height:40px;border:1px solid var(--divider);background:var(--card);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-muted)}
.act:hover{border-color:var(--action);color:var(--action)}
.more{width:44px;height:44px;border:none;background:none;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ink-muted)}
.menu{position:absolute;top:52px;right:0;z-index:25;width:min(260px,calc(100vw - 32px));background:var(--card);border-radius:16px;box-shadow:var(--menu-shadow);padding:8px;display:flex;flex-direction:column}
.mi{min-height:44px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:12px;font-size:15px;background:none;border:none;cursor:pointer;font-family:var(--sans);text-align:left;width:100%}
.mi:hover{background:var(--soft)}
.mi.danger{color:var(--attention-deep)}
.sep{height:1px;background:var(--divider);margin:4px 12px}

/* toasts: drop from the top, hold, carry an Undo */
#toast-layer{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(520px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--border);
  border-radius:16px;padding:14px 14px 14px 16px;display:flex;align-items:center;gap:14px;
  box-shadow:0 12px 36px rgba(47,48,32,.18);animation:drop .2s cubic-bezier(.2,.8,.3,1) both}
.toast.out{animation:lift .16s ease-in both}
.toast .tick{width:32px;height:32px;border-radius:999px;background:var(--softer);display:flex;align-items:center;justify-content:center;flex:none}
.toast .tmsg{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.toast .tverb{font-size:15px;font-weight:600;line-height:1.3}
.toast .tsub{font-size:13px;color:var(--ink-muted);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast .tundo{min-height:40px;padding:0 16px;border:none;border-radius:999px;background:var(--softer);color:var(--action);
  font:600 15px var(--sans);cursor:pointer;flex:none}
.toast .tundo:hover{background:var(--action);color:var(--card)}
.toast .tx{width:36px;height:36px;border:none;border-radius:999px;background:transparent;color:var(--ink-muted);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.toast .tx:hover{background:var(--soft);color:var(--ink)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes lift{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.toast,.toast.out{animation:none}}
@media (max-width:600px){
  .toast{padding:12px;gap:10px}
  .toast .tick{display:none}
  .toast .tundo{padding:0 12px;font-size:14px}
}

/* empty, ending */
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:2px solid var(--divider);padding-top:16px;font-size:15px;color:var(--ink-body)}
.undo{min-height:44px;padding:0 4px;border:none;background:none;color:var(--action);font:600 15px var(--sans);text-decoration:underline;cursor:pointer}
.empty{padding:32px 16px 48px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;border-top:2px solid var(--divider)}
.empty h2{margin:0;font-family:var(--serif);font-weight:600;font-size:20px}
.empty p{margin:0;max-width:46ch;font-size:16px;line-height:1.6;color:var(--ink-body)}
.ending{font-family:var(--serif);font-size:18px;color:var(--ink-body);padding-top:16px;border-top:1px solid var(--divider);margin:0}

/* buttons, fields, cards */
.btn{height:44px;padding:0 20px;border:none;border-radius:999px;background:var(--action);color:var(--card);font:500 14px var(--sans);display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.btn.soft{background:var(--control);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--divider);height:40px}
.field{width:100%;height:48px;border:1px solid var(--border);border-radius:12px;padding:0 16px;font:400 15px var(--sans);color:var(--ink);background:var(--card)}
label.stack{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-muted)}
.card{background:var(--card);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:10vh max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.dialog{width:100%;max-width:560px;background:var(--card);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:20px}
.search-box{width:100%;max-width:720px;background:var(--card);border-radius:24px;box-shadow:var(--menu-shadow);overflow:hidden}
.alert{margin:0;background:var(--problem);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--attention-deep)}

/* reader */
.reader{max-width:720px;margin:0 auto;padding-block:24px 96px}
.reader h1{margin:0;font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.15;text-wrap:balance}
.standfirst{margin:16px 0 0;font-family:var(--serif);font-size:20px;line-height:1.5;color:var(--ink-body)}
.bodycopy{font-family:var(--serif);line-height:1.75;display:flex;flex-direction:column;gap:24px;margin-top:24px}
.bodycopy p{margin:0}
.rbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--page);border-bottom:1px solid var(--divider)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--page)}
.progress{height:3px;background:var(--control)}
.progress span{display:block;height:3px;background:var(--attention)}

.note{margin:0;font-size:13px;color:var(--ink-muted);line-height:1.6}

/* home: greeting, reading time, featured, folder columns, walk, later */
.greet{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-end;justify-content:space-between}
.greet .left{flex:1 1 420px;min-width:0}
.stamp{margin:0 0 8px;font-size:15px;color:var(--ink-muted)}
h1.hero{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(34px,6vw,60px);line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
.timecard{flex:0 1 300px;background:var(--card);border-radius:24px;padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.timecard .trow{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.bar{height:8px;background:var(--control);border-radius:4px}
.bar span{display:block;height:8px;background:var(--action-light);border-radius:4px}
.h2{margin:0;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.2;text-wrap:balance}
.sechead{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
.gear{width:44px;height:44px;margin-right:-11px;border-radius:999px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--action);flex:none}
.featured{background:var(--card);border-radius:28px;overflow:hidden;display:flex;flex-wrap:wrap}
.featured .art{flex:1 1 300px;min-width:0;aspect-ratio:16/10;max-width:100%}
.featured .fbody{flex:1 1 340px;min-width:0;padding:28px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.featured h2{margin:0;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.22;text-wrap:balance}
.fcols{display:flex;flex-wrap:wrap;gap:16px}
.fcard{flex:1 1 220px;min-width:0;background:var(--card);border-radius:20px;padding:20px;border:none;cursor:pointer;
  text-align:left;display:flex;flex-direction:column;gap:10px}
.fcard:hover{box-shadow:0 10px 28px rgba(47,48,32,.1)}
.fcard .ftop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fcard .fname{font-family:var(--serif);font-size:22px;line-height:1.2;color:var(--ink)}
.fcard:hover .fname{color:var(--attention)}
.fcard .fmeta{font-size:14px;color:var(--ink-muted)}
.fcol{flex:1 1 220px;min-width:0;border-top:2px solid var(--divider);padding-top:16px;display:flex;flex-direction:column}
.fcol .ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:8px}
.fcol h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.ficon{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:var(--problem);flex:none}
.fcol button.pick{font-family:var(--serif);font-size:20px;line-height:26px;height:52px;padding:16px 0 0;margin-bottom:16px;
  border:none;border-top:1px solid var(--divider);background:none;text-align:left;cursor:pointer;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%}
.fcol button.pick:hover{color:var(--attention)}
.fcol .none{font-size:15px;color:var(--ink-muted);border-top:1px solid var(--divider);padding-top:16px;margin:0}
.walkgrid{display:flex;flex-wrap:wrap;gap:20px}
.walkcard{flex:1 1 340px;min-width:0;background:var(--softer);border-radius:24px;padding:20px;display:flex;gap:16px;align-items:center}
.walkcard .art{width:120px;aspect-ratio:16/9;flex:none;border-radius:12px;max-width:100%}
.walkcard .wtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.walkcard .wtx .wt{font-family:var(--serif);font-size:20px;line-height:1.25;background:none;border:none;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.walkcard .wtx .wt:hover{color:var(--attention)}
.playbtn{width:48px;height:48px;flex:none;border-radius:999px;border:none;background:var(--action);display:flex;align-items:center;justify-content:center;cursor:pointer}
.latergrid{display:flex;flex-wrap:wrap;gap:20px}
.latercard{flex:1 1 260px;min-width:0;background:var(--card);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:8px;
  border:none;cursor:pointer;text-align:left}
.latercard .lt{font-family:var(--serif);font-size:20px;line-height:1.25;color:var(--ink)}
.latercard:hover .lt{color:var(--attention)}
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;
  width:min(620px,calc(100vw - 32px));background:var(--action);color:#f9f8f4;border-radius:999px;
  padding:8px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 32px rgba(47,48,32,.3)}
.player .pbtn{width:40px;height:40px;border-radius:999px;border:none;background:#f9f8f4;color:var(--action);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.player .ptrack{flex:1;min-width:0;height:4px;border-radius:999px;background:var(--action-light)}
.player .ptrack span{display:block;height:4px;border-radius:999px;background:var(--coral)}
.player .px{width:36px;height:36px;border-radius:999px;border:none;background:transparent;color:#f9f8f4;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
@media (max-width:600px){
  .featured .fbody{padding:20px}
  .featured h2{font-size:22px}
  .h2{font-size:26px}
  .timecard{flex:1 1 100%}
  .player{width:calc(100vw - 24px)}
}
@media (max-width:900px){
  .columns{gap:24px}
  .rail{max-width:none;flex:1 1 100%}
  .side{flex-direction:row;flex-wrap:wrap;gap:6px}
  .side button{width:auto;background:var(--soft)}
  .side button.on{background:var(--action)}
  .sh{border-top:none;width:100%}
}
@media (max-width:600px){
  .top{padding-block:12px;gap:12px}
  .nav{order:3;width:100%;justify-content:space-between}
  .nav button{padding:10px 10px;font-size:13px}
  h1.page{font-size:28px}
  h1.display{font-size:30px}
  .th{width:84px}
  .tt{font-size:17px}
  .meta{font-size:12px}
  .acts{opacity:1}
  .reader h1{font-size:30px}
  .controls{margin-top:-6px}
  .ctl select{max-width:7em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div id="toast-layer" aria-live="polite" aria-atomic="false"></div>

<script>

function bodyFor(title, standfirst){
  return [
    standfirst+' This is placeholder reading copy, set the way a real article will be: a comfortable line length, generous line height, nothing in the margins competing for attention.',
    'The point of this screen is the reading. Nothing slides in from the side, no related items wait at the bottom to pull you onward, and the only thing after the last paragraph is the end.',
    "In the finished version this text comes from the source's own feed with the page furniture stripped out. When a feed carries only an excerpt, the full article is fetched and cleaned before it lands here.",
    '"'+title+'" ends where it ends. The next thing you read is a thing you chose.'
  ];
}
function makeSeed(){
  const now = Date.now();
  const H = 3600000, D = 86400000;
  // read earlier today, so the reading-time bar starts part way along
  const readToday = {4:3*H, 7:5*H, 10:1*H};
  // saved a while ago, so the Later shelf reads like a real backlog
  const savedAgo = {1:2*D, 5:12*D, 9:21*D, 14:34*D};
  const archivedAgo = {20:4*D, 24:9*D, 29:15*D, 33:26*D, 37:40*D};
  const items = DRAFTS.map((d,i)=>{
    const [sourceId,title,kind,minutes,hoursAgo,standfirst] = d;
    const saved = savedAgo[i] !== undefined;
    const archived = archivedAgo[i] !== undefined;
    const readAt = readToday[i];
    const seen = readAt !== undefined ? now - readAt
      : (hoursAgo > 36 && !saved) ? now - (hoursAgo-6)*H
      : null;
    return {
      id:'item-'+(i+1), sourceId, title, standfirst, kind, minutes,
      body: bodyFor(title, standfirst),
      publishedAt: new Date(now - hoursAgo*H).toISOString(),
      seenAt: seen ? new Date(seen).toISOString() : null,
      savedAt: saved ? new Date(now - savedAgo[i]).toISOString() : null,
      archivedAt: archived ? new Date(now - archivedAgo[i]).toISOString() : null,
      deletedAt: null,
    };
  });
  return {version:1, sources:SOURCES.map(s=>({...s})), folders:FOLDERS.map(f=>({...f})), items,
    settings:{markSeenOnScroll:false, showCounts:false, openOriginal:false}};
}
function emptySeed(){
  return {version:1, sources:[], folders:[], items:[], settings:{markSeenOnScroll:false, showCounts:false, openOriginal:false}};
}

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return makeSeed();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function patch(id, p){ const it = S.items.find(i=>i.id===id); if(!it) return; Object.assign(it,p); save(); }
function src(it){ return S.sources.find(s=>s.id===it.sourceId); }
function foldersOf(it){ const s = src(it); if(!s) return []; return s.folders.map(f=>(S.folders.find(x=>x.id===f)||{}).name).filter(Boolean); }

const live = () => S.items.filter(i=>!i.deletedAt);
const isUnseen = i => !i.seenAt && !i.archivedAt && !i.deletedAt;
const isSeen = i => !!i.seenAt && !i.archivedAt && !i.deletedAt;
const isLater = i => !!i.savedAt && !i.archivedAt && !i.deletedAt;
const isArchived = i => !!i.archivedAt && !i.deletedAt;
const KIND = {article:'Article', video:'Video', podcast:'Podcast', discussion:'Discussion'};

function timeAgo(iso){
  const h = Math.round((Date.now()-new Date(iso))/3600000);
  if(h<1) return 'Just now';
  if(h<24) return h+' hour'+(h===1?'':'s')+' ago';
  const d = Math.round(h/24);
  if(d===1) return 'Yesterday';
  if(d<7) return d+' days ago';
  const w = Math.round(d/7);
  return w+' week'+(w===1?'':'s')+' ago';
}
function dayGroup(iso){
  const d = new Date(iso), now = new Date();
  if(d.toDateString()===now.toDateString()) return d.getHours()<12 ? 'This morning' : 'Today';
  const y = new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString()===y.toDateString()) return 'Yesterday';
  const days = Math.round((now-d)/86400000);
  if(days<7) return 'Earlier this week';
  if(days<30) return 'Earlier this month';
  return 'Older';
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function applyFilters(items, p, tabs){
  const tab = tabs.find(t=>t.id===p.tab) || tabs[0];
  let list = items.filter(tab.test);
  if(p.kinds && p.kinds.length) list = list.filter(i=>p.kinds.includes(i.kind));
  if(p.folder && p.folder!=='Any'){
    list = list.filter(i=>{
      const s = src(i);
      if(p.folder==='No folder') return !s || s.folders.length===0;
      const f = S.folders.find(x=>x.name===p.folder);
      return !!(f && s && s.folders.includes(f.id));
    });
  }
  if(p.length==='Under 5 min') list = list.filter(i=>i.minutes<5);
  if(p.length==='5 to 15') list = list.filter(i=>i.minutes>=5 && i.minutes<=15);
  if(p.length==='Longer') list = list.filter(i=>i.minutes>15);
  const sorters = {
    'Newest first':(a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt),
    'Oldest first':(a,b)=>new Date(a.publishedAt)-new Date(b.publishedAt),
    'Shortest first':(a,b)=>a.minutes-b.minutes,
    'Longest first':(a,b)=>b.minutes-a.minutes,
    'Source A to Z':(a,b)=>(src(a)||{}).title.localeCompare((src(b)||{}).title),
    'Recently saved':(a,b)=>new Date(b.savedAt||0)-new Date(a.savedAt||0),
    'Recently archived':(a,b)=>new Date(b.archivedAt||0)-new Date(a.archivedAt||0),
  };
  return list.slice().sort(sorters[p.sort] || sorters['Newest first']);
}

function groupItems(list, mode){
  if(mode==='None') return [['', list]];
  const map = new Map();
  list.forEach(i=>{
    let k = '';
    if(mode==='Date') k = dayGroup(i.publishedAt);
    else if(mode==='Source') k = (src(i)||{}).title || 'Unknown';
    else if(mode==='Type') k = KIND[i.kind];
    else if(mode==='Folder') k = foldersOf(i)[0] || 'No folder';
    map.set(k, [...(map.get(k)||[]), i]);
  });
  return [...map.entries()];
}

/* Toasts: drop down from the top, hold for 10 seconds, carry an Undo.
   Rendered outside the app's markup so a re-render never kills the timer. */
const TOAST_MS = 10000;
let toastSeq = 0;
function showToast(verb, subject, undoFn){
  const layer = document.getElementById('toast-layer');
  if(!layer) return;
  // one at a time: the newest replaces the last, so they never stack up
  [...layer.children].forEach(c=>c.remove());
  const id = 'toast-'+(++toastSeq);
  const el = document.createElement('div');
  el.className = 'toast';
  el.id = id;
  el.setAttribute('role','status');
  el.innerHTML = `<span class="tick">${I.check}</span>
    <span class="tmsg"><span class="tverb">${esc(verb)}</span><span class="tsub">${esc(subject)}</span></span>
    ${undoFn?'<button class="tundo">Undo</button>':''}
    <button class="tx" aria-label="Dismiss">${I.close}</button>`;
  layer.appendChild(el);
  let timer = setTimeout(close, TOAST_MS);
  function close(){
    clearTimeout(timer);
    el.classList.add('out');
    setTimeout(()=>el.remove(), 200);
  }
  const undoBtn = el.querySelector('.tundo');
  if(undoBtn) undoBtn.addEventListener('click', ()=>{ undoFn(); close(); render(); });
  el.querySelector('.tx').addEventListener('click', close);
  // pausing on hover, so a toast you are reading does not vanish mid-sentence
  // hovering holds it open, so a toast you are reading does not vanish mid-sentence
  el.addEventListener('mouseenter', ()=>clearTimeout(timer));
  el.addEventListener('mouseleave', ()=>{ timer = setTimeout(close, 4000); });
}

function listBlock(key, cfg, items){
  const p = prefs(key, cfg.init);
  const shown = applyFilters(items, p, cfg.tabs);
  const tabLabel = (cfg.tabs.find(t=>t.id===p.tab)||cfg.tabs[0]).label;
  if(!shown.length) return controlRow(key,cfg) + cfg.empty(p);
  return controlRow(key,cfg) + groupItems(shown, p.group).map(([k,list])=>
    `<section style="display:flex;flex-direction:column">
      ${k?`<div class="ghead"><h2 class="lbl">${esc(k)}</h2></div>`:''}
      <div class="list" ${k?'style="border-top:none"':''}>${list.map(rowHTML).join('')}</div>
    </section>`).join('') + `<p class="ending">${esc(cfg.ending(shown.length, tabLabel))}</p>`;
}

      <button class="lk" data-back="1" style="display:inline-flex;align-items:center;gap:6px;min-height:44px">${I.back} Back</button>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <button class="ib bare" data-size="1" aria-label="Text size" title="Text size" style="font-family:var(--serif);font-size:16px;font-weight:500">Aa</button>
        <button class="btn ghost" data-act="later|${it.id}">${I.clock} ${it.savedAt?'In Later':'Later'}</button>
        <button class="btn ghost" data-act="archive|${it.id}">${I.box} Archive</button>
        <button class="ib bare" data-act="delete|${it.id}" aria-label="Delete" title="Delete">${I.trash}</button>
      </div>
    </div><div class="progress"><span style="width:34%"></span></div></div>
    <div class="wrap"><article class="reader">
      <div class="meta" style="margin-bottom:16px">
        <span style="width:24px;height:24px;border-radius:6px;background:${s.color};flex:none" aria-hidden="true"></span>
        <span style="font-weight:600;color:var(--ink)">${esc(s.title||'')}</span><span>·</span>
        <span>${timeAgo(it.publishedAt)}</span><span>·</span><span>${it.minutes} min</span>
        <span class="b">${KIND[it.kind]}</span>
      </div>
      <h1>${esc(it.title)}</h1>
      <p class="standfirst">${esc(it.standfirst)}</p>
      <div style="aspect-ratio:16/9;max-width:100%;background:${s.color||'var(--m6)'};border-radius:20px;margin-top:24px"></div>
      <div class="bodycopy" style="font-size:${V.readSize}px">${it.body.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
      <p class="ending" style="margin-top:48px">The end. Nothing else is queued up after this.</p>
    </article></div>`;
}

/* ---------------------------------------------------------------- overlays */
let addError = null, searchQ = '', searchScope = 'Everywhere';

function overlayAdd(){
  return `<div class="scrim" data-scrim="1"><div class="dialog" role="dialog" aria-label="Follow something new" aria-modal="true">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div><p class="lbl" style="color:var(--ink-muted)">Add</p>
        <h2 class="serif" style="margin:6px 0 0;font-weight:400;font-size:28px">Follow something new</h2></div>
      <button class="ib" aria-label="Close" data-close="1" style="background:var(--soft)">${I.close}</button>
    </div>
    <p style="margin:0;font-size:15px;line-height:1.6;color:var(--ink-body)">Paste a blog, a newsletter, a YouTube channel, a podcast or a subreddit. A feed link works too. In the finished app this resolves the feed and pulls in real posts.</p>
    <label class="stack">Link<input class="field" id="add-url" placeholder="fieldnotes.example" autofocus></label>
    ${S.folders.length?`<label class="stack">Folder<select class="field" id="add-folder">
      <option value="">No folder</option>${S.folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}
    </select></label>`:''}
    ${addError?`<p class="alert" role="alert">${esc(addError)}</p>`:''}
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn soft" data-close="1">Cancel</button>
      <button class="btn" data-follow="1">Follow</button>
    </div>
  </div></div>`;
}

function overlaySearch(){
  const term = searchQ.trim().toLowerCase();
  let items = [], sources = [];
  if(term){
    items = live().filter(i=>{
      if(searchScope==='Feed') return !isLater(i) && !isArchived(i);
      if(searchScope==='Library') return isLater(i) || isArchived(i);
      if(searchScope==='Sources') return false;
      return true;
    }).filter(i=>i.title.toLowerCase().includes(term) || i.standfirst.toLowerCase().includes(term)
      || ((src(i)||{}).title||'').toLowerCase().includes(term)).slice(0,8);
    sources = (searchScope==='Feed'||searchScope==='Library') ? [] :
      S.sources.filter(s=>s.title.toLowerCase().includes(term)).slice(0,4);
  }
  const hl = text => {
    if(!term) return esc(text);
    const i = text.toLowerCase().indexOf(term);
    if(i<0) return esc(text);
    return esc(text.slice(0,i))+'<mark style="background:var(--problem);color:var(--ink);padding:0 2px">'+esc(text.slice(i,i+term.length))+'</mark>'+esc(text.slice(i+term.length));
  };
  return `<div class="scrim" data-scrim="1" style="padding-top:8vh"><div class="search-box" role="dialog" aria-label="Search" aria-modal="true">
    <div style="display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--divider)">
      ${I.search}
      <input id="search-q" value="${esc(searchQ)}" placeholder="Search everything you follow" autofocus
        style="flex:1;min-width:0;border:none;outline:none;font-size:18px;font-family:var(--sans);color:var(--ink);background:transparent">
      <button class="lk" data-close="1" style="border:1px solid var(--divider);border-radius:6px;padding:2px 6px;font-size:12px;color:var(--ink-muted)">esc</button>
    </div>
    <div style="display:flex;gap:6px;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid var(--divider)">
      ${['Everywhere','Feed','Library','Sources'].map(s=>`<button class="chip ${searchScope===s?'on':''}" data-scope="${s}">${s}</button>`).join('')}
    </div>
    <div style="max-height:50vh;overflow-y:auto;padding:8px 8px 16px">
      ${!term?`<p style="margin:0;padding:24px 12px;color:var(--ink-muted);font-size:15px">Type to search titles, descriptions and source names.</p>`:''}
      ${term && !items.length && !sources.length?`<p style="margin:0;padding:24px 12px;color:var(--ink-muted);font-size:15px">Nothing matches “${esc(searchQ.trim())}”. Try fewer words.</p>`:''}
      ${items.map(i=>`<button class="mi" data-read="${i.id}" style="align-items:flex-start;padding:12px;min-height:56px">
        <span style="width:56px;aspect-ratio:16/9;border-radius:8px;background:${(src(i)||{}).color||'var(--m4)'};flex:none" aria-hidden="true"></span>
        <span style="display:flex;flex-direction:column;gap:4px;min-width:0">
          <span class="serif" style="font-size:17px;line-height:1.3">${hl(i.title)}</span>
          <span style="font-size:13px;color:var(--ink-muted)">${KIND[i.kind]} · ${esc((src(i)||{}).title||'')} · ${i.minutes} min</span>
        </span></button>`).join('')}
      ${sources.map(s=>`<button class="mi" data-go="sources">
        <span style="width:28px;height:28px;border-radius:999px;background:${s.color};flex:none" aria-hidden="true"></span>
        <span style="font-size:15px">${hl(s.title)}</span>
        <span style="margin-left:auto;font-size:13px;color:var(--ink-muted)">Source</span></button>`).join('')}
    </div>
  </div></div>`;
}

/* ---------------------------------------------------------------- render */
function render(){
  const body = V.view==='read' ? viewRead()
    : V.view==='feed' ? viewFeed()
    : V.view==='library' ? viewLibrary()
    : V.view==='listen' ? viewListen()
    : V.view==='sources' ? viewSources()
    : V.view==='settings' ? viewSettings()
    : viewHome();
  const chrome = V.view==='read' ? '' : header();
  const foot = V.view==='read' ? '' : `<div class="wrap"><p class="note" style="padding-block:0 32px">
    Prototype on sample data in your browser. <button class="lk" data-go="settings">Settings</button> can reset it or empty it to see day one.</p></div>`;
  document.getElementById('app').innerHTML = chrome + body + foot + playerHTML()
    + (V.overlay==='add' ? overlayAdd() : V.overlay==='search' ? overlaySearch() : '');
  const focus = document.getElementById(V.overlay==='add' ? 'add-url' : V.overlay==='search' ? 'search-q' : '');
  if(focus){ focus.focus(); if(focus.value) focus.setSelectionRange(focus.value.length, focus.value.length); }
}

/* ---------------------------------------------------------------- actions */
function doAct(verb, id){
  const it = S.items.find(i=>i.id===id);
  if(!it) return;
  const before = {seenAt:it.seenAt, savedAt:it.savedAt, archivedAt:it.archivedAt, deletedAt:it.deletedAt};
  const now = new Date().toISOString();
  let text = '';
  if(verb==='later'){
    if(it.savedAt){ patch(id,{savedAt:null}); text='Removed from Later'; }
    else { patch(id,{savedAt:now}); text='Saved to Later'; }
  } else if(verb==='archive'){
    patch(id,{archivedAt:now, seenAt:it.seenAt||now}); text='Archived';
  } else if(verb==='seen'){
    if(it.seenAt){ patch(id,{seenAt:null}); text='Marked as unseen'; }
    else { patch(id,{seenAt:now}); text='Marked as seen'; }
  } else if(verb==='delete'){
    patch(id,{deletedAt:now}); text='Deleted';
  }
  V.menuFor = null;
  showToast(text, it.title, ()=>{ patch(id, before); });
  if(V.view==='read' && (verb==='archive'||verb==='delete')){
    setTimeout(()=>{ V.view='feed'; render(); }, 450);
  }
  render();
}

function followSource(){
  const input = document.getElementById('add-url');
  const folderSel = document.getElementById('add-folder');
  const url = (input ? input.value : '').trim();
  addError = null;
  if(!url){ addError = 'Paste a link first.'; render(); return; }
  if(!/\./.test(url)){ addError = "That doesn't look like a link. Try something like fieldnotes.example or a YouTube channel."; render(); return; }
  if(S.sources.some(s=>url.includes(s.site))){ addError = "You already follow this one. It's in your Sources list."; render(); return; }
  const host = url.replace(/^https?:\/\//,'').split('/')[0] || 'example.com';
  const name = host.replace(/^www\./,'').split('.')[0].replace(/[-_]/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
  const id = 'src-'+Date.now();
  const palette = ['var(--m1)','var(--m2)','var(--m3)','var(--m4)','var(--m6)'];
  const color = palette[Math.floor(Math.random()*palette.length)];
  const folderId = folderSel ? folderSel.value : '';
  S.sources.push({id, title:name, kind:'article', site:host, color, status:'ok', folders:folderId?[folderId]:[]});
  const now = Date.now();
  [0,1,2].forEach(n=>{
    const title = [ 'Welcome to '+name, name+': the most recent post', name+': something from last week' ][n];
    S.items.unshift({id:id+'-item-'+n, sourceId:id, title,
      standfirst:'Pulled in when you followed this source.',
      body:['This stands in for a real post from '+name+'.','In the finished version the text comes from the feed, cleaned up for reading.'],
      kind:'article', minutes:4+n*2,
      publishedAt:new Date(now-(n+1)*5*3600000).toISOString(),
      seenAt:null, savedAt:null, archivedAt:null, deletedAt:null});
  });
  save();
  V.overlay = null; addError = null;
  V.view = 'feed'; V.folder = null;
  render();
  showToast('is now in your Feed, with 3 posts', name, ()=>{
    S.sources = S.sources.filter(s=>s.id!==id);
    S.items = S.items.filter(i=>i.sourceId!==id);
    save();
  });
}

/* ---------------------------------------------------------------- events */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-overlay],[data-folder],[data-shelf],[data-read],[data-act],[data-menu],[data-tab],[data-filter],[data-fk],[data-ff],[data-fl],[data-close],[data-scrim],[data-follow],[data-scope],[data-stab],[data-sfeed],[data-seed],[data-size],[data-back],[data-play],[data-pp],[data-pclose]');
  if(!t){ if(V.menuFor || V.filterOpen){ V.menuFor = null; V.filterOpen = false; render(); } return; }

  const d = t.dataset;
  if(d.scrim !== undefined && t === e.target){ V.overlay = null; addError = null; render(); return; }
  if(d.close !== undefined){ V.overlay = null; addError = null; render(); return; }
  if(d.go){ V.overlay = null; go(d.go); return; }
  if(d.overlay){ V.overlay = d.overlay; addError = null; render(); return; }
  if(d.folder !== undefined && d.folder !== ''){ go('feed', {folder:d.folder}); return; }
  if(d.folder === ''){ go('feed', {folder:null}); return; }
  if(d.shelf){ go('library', {shelf:d.shelf}); return; }
  if(d.sfeed !== undefined){ go('feed', {folder:d.sfeed||null}); return; }
  if(d.read){ V.overlay = null; go('read', {itemId:d.read}); const it = S.items.find(i=>i.id===d.read); if(it && !it.seenAt){ patch(it.id,{seenAt:new Date().toISOString()}); } return; }
  if(d.act){ const [verb,id] = d.act.split('|'); doAct(verb,id); return; }
  if(d.menu){ V.menuFor = V.menuFor===d.menu ? null : d.menu; render(); return; }
  if(d.tab){ const [key,tab] = d.tab.split('|'); setPref(key,{tab}); return; }
  if(d.stab){ setPref('sources',{tab:d.stab}); return; }
  if(d.filter === 'toggle'){ V.filterOpen = !V.filterOpen; render(); return; }
  if(d.filter && d.filter.startsWith('clear|')){ setPref(d.filter.split('|')[1], {kinds:[], folder:'Any', length:'Any'}); return; }
  if(d.fk){ const [key,kind] = d.fk.split('|'); const p = prefs(key,{}); const kinds = p.kinds||[];
    setPref(key,{kinds: kinds.includes(kind) ? kinds.filter(k=>k!==kind) : [...kinds,kind]}); return; }
  if(d.ff){ const [key,f] = d.ff.split('|'); setPref(key,{folder:f}); return; }
  if(d.fl){ const [key,l] = d.fl.split('|'); setPref(key,{length:l}); return; }
  if(d.follow){ followSource(); return; }
  if(d.scope){ searchScope = d.scope; render(); return; }
  if(d.seed){ S = d.seed==='demo' ? makeSeed() : emptySeed(); save();
    V.prefs = {}; V.player = null;
    if(d.seed==='empty'){ go('home'); } else { render(); }
    showToast(d.seed==='demo' ? 'is back: 8 sources, 40 items' : 'is empty, so you can see day one', 'Sample content');
    return; }
  if(d.play){ V.player = d.play; V.playing = true;
    const it = S.items.find(i=>i.id===d.play);
    if(it && !it.seenAt) patch(it.id,{seenAt:new Date().toISOString()});
    render(); return; }
  if(d.pp){ V.playing = !V.playing; render(); return; }
  if(d.pclose){ V.player = null; V.playing = false; render(); return; }
  if(d.size){ V.readSize = V.readSize>=24 ? 18 : V.readSize+2; render(); return; }
  if(d.back){ V.view = 'feed'; render(); return; }
});

document.addEventListener('change', e => {
  const d = e.target.dataset;
  if(d.pref){ const [key,field] = d.pref.split('|'); setPref(key,{[field]: e.target.value}); }
  if(d.set){ S.settings[d.set] = e.target.checked; save(); }
});

document.addEventListener('input', e => {
  if(e.target.id === 'search-q'){ searchQ = e.target.value; render(); }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(V.overlay){ V.overlay = null; addError = null; render(); }
    else if(V.menuFor || V.filterOpen){ V.menuFor = null; V.filterOpen = false; render(); }
  }
  if(e.key === 'Enter' && V.overlay === 'add' && document.activeElement && document.activeElement.id === 'add-url'){
    followSource();
  }
});

/* open the view named in the artifact link, if any */
const h = (location.hash || '').replace('#','');
if(VIEWS.includes(h)) V.view = h;
render();
</script>
